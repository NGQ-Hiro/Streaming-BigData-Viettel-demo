global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Kafka consumer-group lag, broker and topic metrics.
  # Note: Spark Structured Streaming tracks its own offsets via checkpoint
  # files, not Kafka consumer groups, so the Grafana "Kafka Lag" dashboard
  # will show no data for the spark-streaming job. Expected, not a bug.
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Native Spark Prometheus metrics (spark.ui.prometheus.enabled, no exporter).
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets: ['spark-master:8080']

  # Targets each worker replica's container name directly -- 'spark-worker:8081'
  # DNS round-robins to only one of the 2 replicas, so listing them individually
  # is required to see all workers.
  - job_name: spark-worker
    metrics_path: /metrics/worker/prometheus
    static_configs:
      - targets:
          - streaming-bigdata-viettel-demo-spark-worker-1:8081
          - streaming-bigdata-viettel-demo-spark-worker-2:8081

  - job_name: spark-streaming
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark-streaming:4040']

  # HiveThriftServer2 (dbt + Superset query engine) -- was previously invisible
  # to monitoring entirely.
  - job_name: spark-thrift
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark-thrift:4040']

  # Per-container CPU / memory / disk from cAdvisor.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # MinIO cluster metrics (exposed with no auth via MINIO_PROMETHEUS_AUTH_TYPE=public).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
