services:
  dbt:
    container_name: dbt_container
    # Build context is the repo root (not .) so the Dockerfile can COPY the
    # shared entrypoint.sh / spark-conf/ templates that live there.
    build:
      context: ..
      dockerfile: dbt/Dockerfile
    volumes:
      - ./my_project:/usr/app
      - .:/root/.dbt
    working_dir: /usr/app
    networks:
      - my-network
    # Manually-triggered batch job, not a long-running service. Default here
    # does a full gold rebuild; override examples:
    #   docker compose run dbt bash -c "dbt deps && dbt docs generate"
    #   docker compose run dbt bash -c "dbt deps && dbt seed"
    # songs.csv (10k rows) is loaded separately via spark_streaming/jobs/load_songs_seed.py
    # (spark-submit against the cluster, see that file's docstring) -- dbt seed
    # only handles state_codes.csv (58 rows, fine as an inline SQL literal).
    command: ["bash", "-c", "dbt deps && dbt seed --select state_codes && dbt run --no-populate-cache"]

networks:
  my-network:
    external: true
    name: lakehouse-network
