
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'my_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Just creates the databases the models below live in -- the streaming job
# owns creating the bronze Hudi tables themselves.
on-run-start:
  - "CREATE DATABASE IF NOT EXISTS staging"
  - "CREATE DATABASE IF NOT EXISTS analytics"
  - "CREATE DATABASE IF NOT EXISTS dim"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  my_project:
    # Config indicated by + and applies to all files under models/example/
    +schema: analytics
    # dbt-spark's Hudi support only exists under the `incremental`
    # materialization, not plain `table` -- so `incremental` +
    # `insert_overwrite_table` strategy is the Hudi equivalent of the old
    # `table` + `file_format: iceberg` full-rebuild-every-run behavior. None
    # of these models use is_incremental() filtering, so each `dbt run`
    # still fully recomputes and overwrites the whole table, just via
    # insert_overwrite instead of a plain CTAS.
    +materialized: incremental
    +incremental_strategy: insert_overwrite
    +file_format: hudi
    dim:
      +schema: dim



seeds:
  my_project:
    +schema: staging
    +file_format: hudi
    songs:
      +schema: staging
    state_codes:
      +schema: staging