
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'my_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Creates the databases the models below live in, then registers the bronze
# Hudi tables that spark-streaming writes. spark-streaming and spark-thrift
# are separate Spark applications with separate, unshared catalogs (no Hive
# metastore service configured) -- spark-streaming's own
# `CREATE TABLE IF NOT EXISTS staging.<topic> USING hudi LOCATION ...` call
# (stream_events.py) only registers each topic in ITS OWN session, so dbt/
# Superset (talking to spark-thrift) can't see staging.auth_events etc.
# without registering them here too. Same reasoning for the songs seed
# (10k rows -- too many for a plain `dbt seed`, whose inline-VALUES compile
# is near-quadratic in Catalyst; reading the CSV as a file source instead
# stays fast at any row count). IF NOT EXISTS makes all of this a no-op after
# the first run.
on-run-start:
  - "CREATE DATABASE IF NOT EXISTS staging"
  - "CREATE DATABASE IF NOT EXISTS analytics"
  - "CREATE DATABASE IF NOT EXISTS dim"
  - "CREATE TABLE IF NOT EXISTS staging.auth_events USING hudi LOCATION 's3a://lakehouse/staging/auth_events'"
  - "CREATE TABLE IF NOT EXISTS staging.listen_events USING hudi LOCATION 's3a://lakehouse/staging/listen_events'"
  - "CREATE TABLE IF NOT EXISTS staging.page_view_events USING hudi LOCATION 's3a://lakehouse/staging/page_view_events'"
  - "CREATE TEMPORARY VIEW songs_seed_raw USING csv OPTIONS (path 'file:///seeds/songs.csv', header 'true', inferSchema 'true')"
  - "CREATE TABLE IF NOT EXISTS staging.songs USING hudi TBLPROPERTIES (type = 'cow', primaryKey = 'song_id', preCombineField = 'song_id') LOCATION 's3a://lakehouse/staging/songs' AS SELECT * FROM songs_seed_raw"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  my_project:
    # Config indicated by + and applies to all files under models/example/
    +schema: analytics
    # dbt-spark's Hudi support only exists under the `incremental`
    # materialization, not plain `table` -- so `incremental` +
    # `insert_overwrite_table` strategy is the Hudi equivalent of the old
    # `table` + `file_format: iceberg` full-rebuild-every-run behavior. None
    # of these models use is_incremental() filtering, so each `dbt run`
    # still fully recomputes and overwrites the whole table, just via
    # insert_overwrite instead of a plain CTAS.
    +materialized: incremental
    +incremental_strategy: insert_overwrite
    +file_format: hudi
    # Same missing-LOCATION issue as the seeds fix below: without this,
    # Spark defaults to the local-disk warehouse dir and Hudi's metadata-table
    # bootstrap throws FileNotFoundException listing a path that never existed.
    +location_root: 's3a://lakehouse/analytics'
    dim:
      +schema: dim
      +location_root: 's3a://lakehouse/dim'



seeds:
  my_project:
    +schema: staging
    +file_format: hudi
    # Without an explicit LOCATION, dbt-spark's seed CREATE TABLE lands in the
    # local-disk default warehouse dir, whose parent path doesn't exist yet --
    # Hudi's metadata-table bootstrap then throws FileNotFoundException trying
    # to list it. The songs CTAS hook avoids this via its own explicit
    # LOCATION; location_root does the same for a seed.
    +location_root: 's3a://lakehouse/staging'
    state_codes:
      +schema: staging