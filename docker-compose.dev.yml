# Dev overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Adds MinIO (S3 stand-in) and points spark-streaming at the dev (rest) env.
services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    hostname: minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets Prometheus scrape /minio/v2/metrics/cluster with no auth.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - my-network

  # One-shot: creates the 'lakehouse' bucket before any Spark job tries to
  # write to it. Runs to completion, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/lakehouse
        echo "Bucket ready: lakehouse"
    networks:
      - my-network

  spark-streaming:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      LAKE_ENV: rest

networks:
  my-network:
    name: lakehouse-network

volumes:
  minio-data:
