# Dev overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Adds MinIO (S3 stand-in) and the Iceberg REST catalog, and points
# spark-streaming at the rest catalog type.
services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    hostname: minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets Prometheus scrape /minio/v2/metrics/cluster with no auth.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - my-network

  # One-shot: creates the 'lakehouse' bucket before any Spark job tries to
  # write to it. Runs to completion, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/lakehouse
        echo "Bucket ready: lakehouse"
    networks:
      - my-network

  # Iceberg REST catalog, backed by MinIO. sqlite metadata lives under
  # /tmp (image default) — volume keeps it across restarts.
  iceberg-rest:
    image: apache/iceberg-rest-fixture
    hostname: iceberg-rest
    container_name: iceberg-rest
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    volumes:
      - iceberg-rest-data:/tmp
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - my-network

  spark-streaming:
    depends_on:
      minio-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
    environment:
      ICEBERG_CATALOG_TYPE: rest

networks:
  my-network:
    name: lakehouse-network

volumes:
  minio-data:
  iceberg-rest-data:
