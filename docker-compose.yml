# Dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Shared image for the Spark standalone cluster (master/worker) and the
# streaming driver — same jars/conf baked in for all three. Build context is
# the repo root (not ./spark_streaming) so the Dockerfile can COPY the
# shared entrypoint.sh / spark-conf/ templates from the repo root.
x-spark-common: &spark-common
  build:
    context: .
    dockerfile: spark_streaming/Dockerfile
  image: spark-lakehouse:latest
  networks:
    - my-network

# Apache Kafka 4.x runs KRaft-only (no Zookeeper). Shared image + common env
# for the 3-node cluster; each broker overrides node id / listeners below.
x-kafka-common: &kafka-common
  image: apache/kafka:4.3.0
  networks:
    - my-network

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker-1:29093,2@broker-2:29093'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
  # 2 nodes → replication factor 2, min ISR 1 for the internal topics
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Fixed cluster id so every node formats the same KRaft metadata log
  CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

services:
  broker-1:
    <<: *kafka-common
    hostname: broker-1
    container_name: broker-1
    # Named volume: the default anonymous one is lost when the container is
    # recreated, leaving Kafka empty while spark-checkpoints still has offsets.
    volumes:
      - broker-1-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://localhost:9092'

  broker-2:
    <<: *kafka-common
    hostname: broker-2
    container_name: broker-2
    # Named volume: the default anonymous one is lost when the container is
    # recreated, leaving Kafka empty while spark-checkpoints still has offsets.
    volumes:
      - broker-2-data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:29092,PLAINTEXT_HOST://localhost:9094'

  # Creates the event topics with 3 partitions (replication-factor 2) before any
  # producer runs, so partitioning isn't left to broker auto-create defaults.
  # Runs to completion, then exits.
  kafka-init:
    <<: *kafka-common
    container_name: kafka-init
    depends_on:
      - broker-1
      - broker-2
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to accept requests..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 --list >/dev/null 2>&1; do sleep 3; done
        for t in listen_events page_view_events auth_events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 2
          # If the topic already existed with fewer partitions, grow it to 3.
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 \
            --alter --topic "$$t" --partitions 3 2>/dev/null || true
        done
        echo "Topics ready (3 partitions each):"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 --describe | grep -E 'Topic:|PartitionCount'

  # Event generator. Auto-runs on `compose up` after the topics exist. Uses the
  # container's (GNU) date to set start = now - BACKFILL_DAYS (default 3) and end = now + 24h.
  # Past-dated events are sent as fast as possible (backfill), then it runs in real time.
  eventsim:
    build: ./eventsim
    image: eventsim:latest
    container_name: eventsim
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        START=$$(date -u -d "-$${BACKFILL_DAYS:-3} days" +"%Y-%m-%dT%H:%M:%S")
        END=$$(date -u -d "+24 hours" +"%Y-%m-%dT%H:%M:%S")
        echo "Running eventsim with start=$$START end=$$END"
        exec /opt/eventsim/eventsim.sh \
          -c examples/example-config.json \
          --continuous \
          --start-time "$$START" \
          --end-time "$$END" \
          --nusers 500000 \
          --growth-rate 10 \
          --userid 1 \
          --kafkaBrokerList broker-1:29092,broker-2:29092
    networks:
      - my-network

  spark-master:
    <<: *spark-common
    hostname: spark-master
    container_name: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8086:8080"
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    # Executors run inside these worker containers in standalone mode, so a
    # file path only readable on the driver (e.g. -v mount on a one-off
    # `docker compose run`) isn't enough for file-based reads (CSV, etc.) --
    # every worker needs the same path. Read-only: this is input data, not
    # written back here.
    volumes:
      - ./dbt/my_project/seeds:/seeds:ro
    depends_on:
      - spark-master
    deploy:
      replicas: 2
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    # Range form so each replica gets its own host port (a fixed single
    # mapping would collide across replicas).
    ports:
      - "8087-8088:8081"

  # Structured Streaming driver. Unlike the old one-shot flink-job-submitter,
  # spark-submit in client mode blocks for the life of the job (the container
  # IS the driver), so this restarts if it dies rather than running once.
  spark-streaming:
    <<: *spark-common
    container_name: spark-streaming
    volumes:
      - ./spark_streaming/jobs:/opt/spark/jobs
      - spark-checkpoints:/opt/spark/checkpoints
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      eventsim:
        condition: service_started
      hive-metastore-db:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      LAKE_ENV: rest
    restart: unless-stopped
    # cores.max=2 caps this job to half the cluster (2 workers x 2 cores = 4
    # total) so spark-thrift isn't left waiting on slots. No headroom left
    # for ad-hoc Spark SQL at this cluster size.
    command:
      - spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      - /opt/spark/jobs/stream_events.py

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    hostname: minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets Prometheus scrape /minio/v2/metrics/cluster with no auth.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - my-network

  # One-shot: creates the 'lakehouse' bucket before any Spark job tries to
  # write to it. Runs to completion, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/lakehouse
        echo "Bucket ready: lakehouse"
    networks:
      - my-network

  # Shared Hive metastore DB for spark-streaming + spark-thrift (see
  # spark-conf/hive-site.xml) -- so tables spark-streaming creates are
  # visible to spark-thrift/dbt/Superset without the two apps needing a
  # common in-process catalog. Schema is loaded from the official Hive 2.3.0
  # postgres schema script (matches the hive-metastore-2.3.9 jars this repo's
  # Spark image bundles) via postgres's own docker-entrypoint-initdb.d, run
  # once on an empty volume. NOT relying on DataNucleus's own
  # autoCreateSchema/autoCreateAll for this: under concurrent connections it
  # deadlocks itself creating FK constraints (two DataNucleus-opened JDBC
  # connections racing DDL on the same table) -- pre-loading the schema up
  # front means Spark's Hive client finds everything already there and never
  # takes that code path.
  hive-metastore-db:
    image: postgres:16-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - ./spark-conf/hive-metastore-init:/docker-entrypoint-initdb.d:ro
      - hive-metastore-data:/var/lib/postgresql/data
    networks:
      - my-network

  # Long-running Spark Thrift Server: lets dbt (method: thrift) submit SQL
  # onto the real spark-master cluster instead of a local in-process
  # SparkSession, so it shares the same worker pool as spark-streaming.
  # cores.max=2 uses the other half of the cluster (4 total, streaming
  # takes 2, this takes 2) -- no headroom left for ad-hoc Spark SQL.
  spark-thrift:
    <<: *spark-common
    container_name: spark-thrift
    volumes:
      # Lets the songs-seed on-run-start hook (dbt_project.yml) read the CSV
      # straight off disk via the driver -- no separate spark-submit job/app
      # needed, so no extra cluster cores to free up.
      - ./dbt/my_project/seeds:/seeds:ro
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      hive-metastore-db:
        condition: service_started
    restart: unless-stopped
    ports:
      - "10000:10000"
    command:
      - spark-submit
      - --class
      - org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      # 4 cores total: default 200 shuffle partitions = hundreds of tiny tasks +
      # tiny Hudi files on MinIO. AQE coalesces them and can broadcast small dims.
      - --conf
      - spark.sql.shuffle.partitions=8
      - --conf
      - spark.sql.adaptive.enabled=true
      - --conf
      - spark.sql.adaptive.coalescePartitions.enabled=true
      - --hiveconf
      - hive.server2.thrift.port=10000
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0

  # Superset: BI dashboards, queries spark-thrift via its HiveServer2 SQLAlchemy
  # dialect (see superset/README.md for the connection URI). Replaces the old
  # Power BI setup; uses its bundled SQLite metadata DB, no separate Postgres.
  superset:
    build:
      context: ./superset
    hostname: superset
    container_name: superset
    ports:
      - "8888:8088"
    environment:
      # Dev-only placeholder. Must be replaced with a real secret for any
      # non-local deployment.
      SUPERSET_SECRET_KEY: dev-only-secret-key
    depends_on:
      spark-thrift:
        condition: service_started
    networks:
      - my-network

  # Airflow 3 in `standalone` mode (api-server + scheduler + dag-processor in
  # one container, SQLite metadata) -- enough for a local demo.
  # shortcut: SQLite + standalone, not for real load; use postgres + split services then.
  # Login: admin / admin (dev only; password file is written at start).
  # dbt runs inside this container (venv from airflow/Dockerfile); Superset
  # refresh is an HTTP call. No docker socket needed.
  airflow:
    build:
      context: ./airflow
      additional_contexts:
        dbt_dir: ./dbt/my_project
    image: airflow-dbt:latest
    container_name: airflow
    # Create the 1-slot pool that serialises everything using spark-thrift.
    command: >
      bash -c "echo '{\"admin\": \"admin\"}' > /opt/airflow/simple_auth_manager_passwords.json.generated &&
      airflow db migrate &&
      airflow pools set thrift_pool 1 'spark-thrift users' &&
      exec airflow standalone"
    ports:
      - "8000:8080"
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: pyhive[hive_pure_sasl]
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./superset:/opt/airflow/superset:ro
      - airflow-data:/opt/airflow
    networks:
      - my-network

  # --- Monitoring stack -------------------------------------------------------

  # Exposes Kafka consumer-group lag (and broker/topic metrics) to Prometheus
  # on :9308. Talks to the KRaft brokers over the internal listener.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    hostname: kafka-exporter
    container_name: kafka-exporter
    restart: on-failure
    command:
      - '--kafka.server=broker-1:29092'
      - '--kafka.server=broker-2:29092'
    ports:
      - "9308:9308"
    depends_on:
      - broker-1
      - broker-2
    networks:
      - my-network

  # Per-container CPU / memory / disk (filesystem + I/O) metrics on :8080,
  # covering the Spark master/worker/streaming containers and everything else
  # in the stack.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    hostname: cadvisor
    container_name: cadvisor
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - my-network

  prometheus:
    image: prom/prometheus:v2.54.1
    hostname: prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
      - cadvisor
    networks:
      - my-network

  grafana:
    image: grafana/grafana:11.2.0
    hostname: grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - my-network

networks:
  my-network:
    name: lakehouse-network

volumes:
  broker-1-data:
  broker-2-data:
  airflow-data:
  minio-data:
  prometheus-data:
  grafana-data:
  spark-checkpoints:
  hive-metastore-data:
