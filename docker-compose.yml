# Dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Shared image for the Spark standalone cluster (master/worker) and the
# streaming driver — same jars/conf baked in for all three. Build context is
# the repo root (not ./spark_streaming) so the Dockerfile can COPY the
# shared entrypoint.sh / spark-conf/ templates from the repo root.
x-spark-common: &spark-common
  build:
    context: .
    dockerfile: spark_streaming/Dockerfile
  image: spark-lakehouse:latest
  networks:
    - my-network

# Apache Kafka 4.x runs KRaft-only (no Zookeeper). Shared image + common env
# for the 3-node cluster; each broker overrides node id / listeners below.
x-kafka-common: &kafka-common
  image: apache/kafka:4.3.0
  networks:
    - my-network

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker-1:29093,2@broker-2:29093'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
  # 2 nodes → replication factor 2, min ISR 1 for the internal topics
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Fixed cluster id so every node formats the same KRaft metadata log
  CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

# x-airflow-common: &airflow-common
#   image: apache/airflow:3.0.3
#   volumes:
#     # - ./airflow/dags:/opt/airflow/dags
#     # - ./airflow/logs:/opt/airflow/logs
#     # - ./airflow/jobs:/opt/airflow/jobs
#     # must create file and gain permission for docker
#     # - ./airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
#     - ./airflow:/opt/airflow
#     - /var/run/docker.sock:/var/run/docker.sock

#   env_file:
#     - airflow.env
#   depends_on:
#     - postgres
#   networks:
#     - my-network

services:
  broker-1:
    <<: *kafka-common
    hostname: broker-1
    container_name: broker-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://localhost:9092'

  broker-2:
    <<: *kafka-common
    hostname: broker-2
    container_name: broker-2
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:29092,PLAINTEXT_HOST://localhost:9094'

  # Creates the event topics with 3 partitions (replication-factor 2) before any
  # producer runs, so partitioning isn't left to broker auto-create defaults.
  # Runs to completion, then exits.
  kafka-init:
    <<: *kafka-common
    container_name: kafka-init
    depends_on:
      - broker-1
      - broker-2
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to accept requests..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 --list >/dev/null 2>&1; do sleep 3; done
        for t in listen_events page_view_events auth_events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 2
          # If the topic already existed with fewer partitions, grow it to 3.
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 \
            --alter --topic "$$t" --partitions 3 2>/dev/null || true
        done
        echo "Topics ready (3 partitions each):"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker-1:29092 --describe | grep -E 'Topic:|PartitionCount'

  # Event generator. Auto-runs on `compose up` after the topics exist. Uses the
  # container's (GNU) date to set start = now and end = now + 24h.
  eventsim:
    build: ./eventsim
    image: eventsim:latest
    container_name: eventsim
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        START=$$(date -u +"%Y-%m-%dT%H:%M:%S")
        END=$$(date -u -d "+24 hours" +"%Y-%m-%dT%H:%M:%S")
        echo "Running eventsim with start=$$START end=$$END"
        exec /opt/eventsim/eventsim.sh \
          -c examples/example-config.json \
          --continuous \
          --start-time "$$START" \
          --end-time "$$END" \
          --nusers 1000000 \
          --growth-rate 10 \
          --userid 1 \
          --kafkaBrokerList broker-1:29092,broker-2:29092
    networks:
      - my-network

  spark-master:
    <<: *spark-common
    hostname: spark-master
    container_name: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8086:8080"
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    # Executors run inside these worker containers in standalone mode, so a
    # file path only readable on the driver (e.g. -v mount on a one-off
    # `docker compose run`) isn't enough for file-based reads (CSV, etc.) --
    # every worker needs the same path. Read-only: this is input data, not
    # written back here.
    volumes:
      - ./dbt/my_project/seeds:/seeds:ro
    depends_on:
      - spark-master
    deploy:
      replicas: 2
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    # Range form so each replica gets its own host port (a fixed single
    # mapping would collide across replicas).
    ports:
      - "8087-8088:8081"

  # Structured Streaming driver. Unlike the old one-shot flink-job-submitter,
  # spark-submit in client mode blocks for the life of the job (the container
  # IS the driver), so this restarts if it dies rather than running once.
  spark-streaming:
    <<: *spark-common
    container_name: spark-streaming
    volumes:
      - ./spark_streaming/jobs:/opt/spark/jobs
      - spark-checkpoints:/opt/spark/checkpoints
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      eventsim:
        condition: service_started
    restart: unless-stopped
    # cores.max=2 caps this job to half the cluster (2 workers x 2 cores = 4
    # total) so spark-thrift isn't left waiting on slots. No headroom left
    # for ad-hoc Spark SQL at this cluster size.
    command:
      - spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      - /opt/spark/jobs/stream_events.py

  # Long-running Spark Thrift Server: lets dbt (method: thrift) submit SQL
  # onto the real spark-master cluster instead of a local in-process
  # SparkSession, so it shares the same worker pool as spark-streaming.
  # cores.max=2 uses the other half of the cluster (4 total, streaming
  # takes 2, this takes 2) -- no headroom left for ad-hoc Spark SQL.
  spark-thrift:
    <<: *spark-common
    container_name: spark-thrift
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    restart: unless-stopped
    ports:
      - "10000:10000"
    command:
      - spark-submit
      - --class
      - org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      - --hiveconf
      - hive.server2.thrift.port=10000
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0

  # Superset: BI dashboards, queries spark-thrift via its HiveServer2 SQLAlchemy
  # dialect (see superset/README.md for the connection URI). Replaces the old
  # Power BI setup; uses its bundled SQLite metadata DB, no separate Postgres.
  superset:
    build:
      context: ./superset
    hostname: superset
    container_name: superset
    ports:
      - "8888:8088"
    environment:
      # Dev-only placeholder. Must be replaced with a real secret for any
      # non-local deployment.
      SUPERSET_SECRET_KEY: dev-only-secret-key
    depends_on:
      spark-thrift:
        condition: service_started
    networks:
      - my-network

  # postgres:
  #   image: postgres:14.18
  #   ports:
  #     - 5000:5432
  #   environment:
  #     POSTGRES_DB: airflow_db
  #     POSTGRES_USER: airflow
  #     POSTGRES_PASSWORD: airflow
  #   volumes:
  #     - ./postgres/data:/var/lib/postgresql/data
  #   networks:
  #     - my-network

  # airflow-scheduler:
  #   <<: *airflow-common
  #   command: bash -c "airflow db migrate && airflow scheduler"

  # airflow-webserver:
  #   <<: *airflow-common
  #   command: api-server
  #   ports:
  #     - 8000:8080
  #   depends_on:
  #     - airflow-scheduler

  # airflow-dag-processor:
  #   <<: *airflow-common
  #   command: airflow dag-processor
  #   depends_on:
  #     - airflow-scheduler

  # --- Monitoring stack -------------------------------------------------------

  # Exposes Kafka consumer-group lag (and broker/topic metrics) to Prometheus
  # on :9308. Talks to the KRaft brokers over the internal listener.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    hostname: kafka-exporter
    container_name: kafka-exporter
    restart: on-failure
    command:
      - '--kafka.server=broker-1:29092'
      - '--kafka.server=broker-2:29092'
    ports:
      - "9308:9308"
    depends_on:
      - broker-1
      - broker-2
    networks:
      - my-network

  # Per-container CPU / memory / disk (filesystem + I/O) metrics on :8080,
  # covering the Spark master/worker/streaming containers and everything else
  # in the stack.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    hostname: cadvisor
    container_name: cadvisor
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - my-network

  prometheus:
    image: prom/prometheus:v2.54.1
    hostname: prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
      - cadvisor
    networks:
      - my-network

  grafana:
    image: grafana/grafana:11.2.0
    hostname: grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - my-network

networks:
  my-network:
    name: lakehouse-network

volumes:
  prometheus-data:
  grafana-data:
  spark-checkpoints:
